[tool.poetry]
name = "devduel-backend"
version = "0.1.0"
description = ""
authors = ["garimagupta-unthinkable <garima.gupta@unthinkable.co>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.128.0,<0.129.0"
uvicorn = {extras = ["standard"], version = ">=0.40.0,<0.41.0"}
pydantic-settings = ">=2.12.0,<3.0.0"
sqlalchemy = ">=2.0.45,<3.0.0"
asyncpg = ">=0.31.0,<0.32.0"
email-validator = ">=2.3.0,<3.0.0"
alembic = ">=1.17.2,<2.0.0"
sqlmodel = ">=0.0.31,<0.0.32"
tzdata = ">=2024.2,<2025.0"
pyjwt = ">=2.8.0,<3.0.0"
passlib = {extras = ["bcrypt"], version = ">=1.7.4,<2.0.0"}
bcrypt = "3.2.2"
psycopg = {extras = ["binary"], version = ">=3.3.3,<4.0.0"}
psycopg2-binary = ">=2.9.11,<3.0.0"
redis = ">=5.0.1,<6.0.0"
httpx = ">=0.28.1,<0.29.0"
isort = "^8.0.1"
black = "^26.3.1"
psycopg2 = "^2.9.11"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.19.1,<2.0.0"
flake8 = "^7.3"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"