[tool.poetry]
name = "gopool-backend"
version = "0.1.0"
description = ""
authors = ["garimagupta-unthinkable <garima.gupta@unthinkable.co>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.128.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
pydantic-settings = "^2.12.0"
sqlalchemy = "^2.0.45"
sqlmodel = "^0.0.31"
asyncpg = "^0.31.0"
alembic = "^1.17.2"
email-validator = "^2.3.0"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "3.2.2"
redis = "^5.0.1"
httpx = "^0.28.1"
tzdata = "^2024.2"
psycopg = "^3.3.2"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
types-passlib = "^1.7.7.20250602"
mypy = "^1.19.1"
black = "^26.1.0"
isort = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
