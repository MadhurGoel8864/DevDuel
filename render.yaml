services:
  - type: web
    name: DevDuel_Backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devdual_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: devdual_redis
          property: connectionString

  - type: redis
    name: devdual_redis
    plan: free

databases:
  - name: devdual_db
    plan: free